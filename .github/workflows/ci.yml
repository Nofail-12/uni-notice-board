name: CI Pipeline

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - feature/*

jobs:
  # ----------------------
  # Lint HTML
  # ----------------------
  lint-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
       uses: actions/setup-node@v4

      - name: Setup Node.js
       uses: actions/setup-node@v4

        with:
         node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run HTMLHint
        run: npm run lint:html

  # ----------------------
  # Lint CSS
  # ----------------------
  lint-css:
    runs-on: ubuntu-latest
    needs: lint-html
    steps:
      - name: Checkout code
       uses: actions/setup-node@v4


      - name: Setup Node.js
       uses: actions/setup-node@v4

        with:
         node-version: '20'


      - name: Install dependencies
        run: npm ci

      - name: Run Stylelint
        run: npm run lint:css

  # ----------------------
  # Build Parcel
  # ----------------------
  build:
    runs-on: ubuntu-latest
    needs: [lint-html, lint-css]
    steps:
      - name: Checkout code
       uses: actions/setup-node@v4


      - name: Setup Node.js
       uses: actions/setup-node@v4

        with:
          node-version: '20'


      - name: Install dependencies
        run: npm ci

      - name: Build site with Parcel
        run: npm run build

  # ----------------------
  # Docker Build & Push
  # ----------------------
  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/setup-node@v4


      - name: Log in to Docker Hub
        uses: actions/setup-node@v4

        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/uni-notice-board:latest .

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/uni-notice-board:latest
